name: Remind about post ideas

# Sundays 06:00 UTC (two hours after propose-ideas.yml): if the ideas issue is still open
# (nobody has approved / held / rejected yet), send a Telegram reminder with the link.

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  remind:
    environment: production  # the Telegram secrets live in this environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install requests

      - name: Remind if the ideas are still waiting
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          url=$(gh issue list --label content-ideas --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then echo "No ideas waiting - no reminder."; exit 0; fi
          printf '⏰ Reminder: post ideas are still waiting for your decision.\nComment /approve 1,3 hold 2 reject 4 on:\n%s\n' "$url" > telegram.txt
          python make_content.py notify --text-file telegram.txt
